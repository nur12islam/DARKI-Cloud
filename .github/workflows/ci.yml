name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build and upload the release APK"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          "$ANDROID_HOME/platform-tools/adb" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Prepare release signing
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          DARKI_KEYSTORE_BASE64: ${{ secrets.DARKI_KEYSTORE_BASE64 }}
        run: |
          test -n "$DARKI_KEYSTORE_BASE64"
          printf '%s' "$DARKI_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"
          test -s "$GITHUB_WORKSPACE/release-key.jks"
      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: android
        env:
          DARKI_KEYSTORE_FILE: ${{ github.workspace }}/release-key.jks
          DARKI_KEYSTORE_PASSWORD: ${{ secrets.DARKI_KEYSTORE_PASSWORD }}
          DARKI_KEY_ALIAS: ${{ secrets.DARKI_KEY_ALIAS }}
          DARKI_KEY_PASSWORD: ${{ secrets.DARKI_KEY_PASSWORD }}
          DARKI_CLOUD_BASE_URL: ${{ secrets.DARKI_CLOUD_BASE_URL }}
        run: |
          test -n "$DARKI_KEYSTORE_PASSWORD"
          test -n "$DARKI_KEY_ALIAS"
          test -n "$DARKI_KEY_PASSWORD"
          test -n "$DARKI_CLOUD_BASE_URL"
          gradle assembleRelease --stacktrace --no-daemon -PdarkiCloudBaseUrl="$DARKI_CLOUD_BASE_URL"
      - name: Remove release keystore
        if: always() && github.event_name == 'workflow_dispatch' && inputs.release
        run: rm -f "$GITHUB_WORKSPACE/release-key.jks"
      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: darki-cloud-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
